<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="title desc">
  <title id="title">Jee Edge login background</title>
  <desc id="desc">A charcoal study themed panel beside a warm light login panel.</desc>
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#FFFFFF" stroke-opacity=".055"/></pattern>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#25262C"/><stop offset="1" stop-color="#18191D"/></linearGradient>
  </defs>
  <path fill="#F5F5F7" d="M0 0h2000v1200H0z"/>
  <path fill="url(#panel)" d="M0 0h1050v1200H0z"/>
  <path fill="url(#grid)" d="M0 0h1050v1200H0z"/>
  <path d="M1050 0v1200" stroke="#DFDFE5"/>
  <g font-family="Arial,Helvetica,sans-serif">
    <rect x="114" y="96" width="47" height="47" rx="11" fill="#BA431F"/>
    <path d="m126 122 10 10 14-23" fill="none" stroke="#FFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="177" y="130" fill="#FFFFFF" font-size="32" font-weight="700" letter-spacing="-1">jee<tspan fill="#F0A17E">edge</tspan></text>
    <text x="114" y="316" fill="#F0A17E" font-size="19" font-weight="700" letter-spacing="4">A SMARTER WAY TO PREPARE</text>
    <text x="110" y="400" fill="#FFFFFF" font-size="63" font-weight="700" letter-spacing="-2">Practice with a</text>
    <text x="110" y="477" fill="#FFFFFF" font-size="63" font-weight="700" letter-spacing="-2">clearer picture.</text>
    <text x="114" y="538" fill="#BCBDC8" font-size="22">Focused questions. Real exam pressure.</text>
    <text x="114" y="570" fill="#BCBDC8" font-size="22">Progress you can actually see.</text>
    <g transform="translate(114 654)">
      <rect width="703" height="285" rx="16" fill="#313238" stroke="#686970" stroke-opacity=".5"/>
      <text x="30" y="42" fill="#C9CAD0" font-size="15" font-weight="700" letter-spacing="2">YOUR NEXT SESSION</text>
      <text x="30" y="99" fill="#FFFFFF" font-size="30" font-weight="700">One question at a time.</text>
      <path d="M30 135h643" stroke="#606168"/>
      <g fill="#45464E"><rect x="30" y="165" width="73" height="74" rx="9"/><rect x="117" y="165" width="73" height="74" rx="9"/><rect x="204" y="165" width="73" height="74" rx="9"/><rect x="291" y="165" width="73" height="74" rx="9"/></g>
      <rect x="378" y="165" width="73" height="74" rx="9" fill="#BA431F"/>
      <g fill="#FFFFFF" font-size="26" font-weight="700" text-anchor="middle"><text x="66" y="212">1</text><text x="153" y="212">2</text><text x="240" y="212">3</text><text x="327" y="212">4</text><text x="414" y="212">5</text></g>
      <text x="480" y="207" fill="#D6D6DB" font-size="17">Keep going →</text>
    </g>
    <text x="114" y="1087" fill="#A7A8B1" font-size="18">Built for the way JEE actually feels.</text>
  </g>
</svg>
