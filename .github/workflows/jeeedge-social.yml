name: JeeEdge Instagram preview
on:
  workflow_dispatch:
    inputs:
      preview_only:
        description: Preview the active renderer (never publishes)
        type: boolean
        default: true
      day:
        description: Optional preview date (YYYY-MM-DD)
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: jeeedge-instagram-preview
  cancel-in-progress: false
jobs:
  preview:
    if: inputs.preview_only == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/version-1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r social/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Render two Reels and two carousels without provider calls
        env:
          PREVIEW_DAY: ${{ inputs.day }}
        run: |
          if [ -n "$PREVIEW_DAY" ]; then
            python -m social.preview --day "$PREVIEW_DAY"
          else
            python -m social.preview
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jeeedge-preview-${{ github.run_id }}
          path: |
            social/output/**/reel.mp4
            social/output/**/cover.png
            social/output/**/caption.txt
            social/output/**/scene-*.png
            social/output/**/[1-8].png
            social/output/contact-sheet.jpg
            social/output/plan.json
          if-no-files-found: ignore
          retention-days: 14
